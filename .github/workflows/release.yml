name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # BtbN/FFmpeg-Builds は月末のビルドを2年間保持する。更新するときは THIRD_PARTY_NOTICES.md も直すこと
  FFMPEG_RELEASE: autobuild-2026-10-31-12-59
  FFMPEG_ASSET: ffmpeg-n8.1.3-27-g8dca1586f4-win64-lgpl-8.1
  FFMPEG_SHA256: d4c2a42673917b4a97104a3e9f082729a9730796b98664e37c0b7eba6c6c613d

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build
        run: python -m PyInstaller packaging/yomiage.spec --noconfirm

      - name: Collect licenses
        run: python packaging/collect_licenses.py dist/licenses

      - name: Download FFmpeg
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_RELEASE/$env:FFMPEG_ASSET.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg のハッシュが一致しません: $hash" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted

          $version = & "ffmpeg-extracted/$env:FFMPEG_ASSET/bin/ffmpeg.exe" -version | Out-String
          if ($version -match "--enable-(gpl|nonfree)") { throw "LGPL ビルドではありません" }
          if ($version -notmatch "--enable-libopus") { throw "libopus が有効になっていません" }

      - name: Assemble package
        run: |
          $stage = "yomiage-$env:GITHUB_REF_NAME-win64"
          New-Item -ItemType Directory "$stage/ffmpeg" | Out-Null
          Copy-Item dist/yomiage/* $stage -Recurse
          Copy-Item "ffmpeg-extracted/$env:FFMPEG_ASSET/bin/ffmpeg.exe" "$stage/ffmpeg/"
          Copy-Item "ffmpeg-extracted/$env:FFMPEG_ASSET/LICENSE.txt" "$stage/ffmpeg/"
          Copy-Item dist/licenses $stage -Recurse
          Copy-Item config.example.toml, README.md, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md $stage
          Compress-Archive $stage "$stage.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: yomiage-${{ github.ref_name }}-win64.zip
